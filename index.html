<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>公平的debuff抽取机</title>
  <style>
    :root {
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #f59e0b;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem;
    }

    /* 网站大标题 */
    .site-title {
      font-size: 2.5rem;
      font-weight: 800;
      color: #fff;
      margin-bottom: 2rem;
      text-shadow: 0 0 15px rgba(99, 102, 241, 0.5);
      text-align: center;
    }

    .app-container {
      display: grid;
      grid-template-columns: 1fr 350px;
      gap: 2rem;
      width: 100%;
      max-width: 1500px;
      background: var(--card-bg);
      padding: 2rem;
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    @media (max-width: 968px) {
      .app-container {
        grid-template-columns: 1fr;
      }
    }

    /* 抽取栏区域 */
    .slot-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }

    .row-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .slot-row {
      width: 100%;
    }

    .row-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 0.4rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    /* 可输入选手名输入框样式 */
    .inline-player-input {
      width: 110px;
      padding: 0.2rem 0.5rem;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--accent);
      font-size: 1.05rem;
      font-weight: 700;
      outline: none;
      transition: border-color 0.2s ease, width 0.2s ease;
      text-align: center;
    }

    .inline-player-input:focus {
      border-color: var(--primary);
      width: 150px;
    }

    /* 滚动槽窗口 */
    .slot-window {
      position: relative;
      width: 100%;
      height: 90px;
      background: #090d16;
      border: 3px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.8);
      transition: border-color 0.3s;
    }

    .slot-window.active {
      border-color: var(--primary);
    }

    /* 居中指示线 */
    .slot-window::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      border-top: 20px solid rgba(9, 13, 22, 0.6);
      border-bottom: 20px solid rgba(9, 13, 22, 0.6);
      z-index: 2;
      pointer-events: none;
    }

    .slot-window::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 50px;
      transform: translateY(-50%);
      border-top: 2px solid var(--accent);
      border-bottom: 2px solid var(--accent);
      z-index: 3;
      pointer-events: none;
    }

    .slot-reel {
      display: flex;
      flex-direction: column;
      position: absolute;
      width: 100%;
      top: 0;
      left: 0;
      will-change: transform;
    }

    .slot-item {
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      font-weight: 600;
      color: #fff;
      text-align: center;
      padding: 0 1rem;
      padding-top: 2px;
    }

    /* 调整初始提示垂直居中偏下位置 */
    .slot-reel > .slot-item:first-child {
      padding-top: 20px;
    }

    /* 控制按钮 */
    .controls {
      display: flex;
      gap: 1rem;
      width: 100%;
      margin-top: 1rem;
    }

    button {
      flex: 1;
      padding: 0.85rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-spin {
      background-color: var(--primary);
      color: white;
    }

    .btn-spin:hover:not(:disabled) {
      background-color: var(--primary-hover);
      transform: translateY(-1px);
    }

    .btn-spin:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-reset {
      background-color: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      flex: 0.3;
    }

    .btn-reset:hover {
      background-color: rgba(255, 255, 255, 0.05);
      color: var(--text);
    }

    /* FAQ 区域 */
    .faq-section {
      border-left: 1px solid var(--border);
      padding-left: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      overflow-y: auto;
      max-height: 500px;
    }

    @media (max-width: 968px) {
      .faq-section {
        border-left: none;
        border-top: 1px solid var(--border);
        padding-left: 0;
        padding-top: 1.5rem;
      }
    }

    .faq-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text);
      border-bottom: 2px solid var(--border);
      padding-bottom: 0.5rem;
    }

    .faq-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      padding: 1rem;
      border-radius: 8px;
    }

    .faq-box h3 {
      font-size: 0.95rem;
      color: var(--accent);
      margin-bottom: 0.5rem;
    }

    .faq-box p {
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.5;
      white-space: pre-line;
    }
  </style>
</head>
<body>

<h1 class="site-title">🎮 公平的双人Debuff抽取系统</h1>

<div class="app-container">
  <!-- 抽取主区域 -->
  <div class="slot-section">
    <div class="row-container">
      <!-- 1. 地图抽取栏 -->
      <div class="slot-row">
        <div class="row-title">🗺️ 比赛地图：</div>
        <div class="slot-window active" id="window-map">
          <div class="slot-reel" id="reel-map">
            <div class="slot-item">等待抽取比赛地图...</div>
          </div>
        </div>
      </div>

      <!-- 2. 选手A抽取栏 -->
      <div class="slot-row">
        <div class="row-title">
          👤 <input type="text" id="player1Name" class="inline-player-input" value="选手 A" placeholder="输入名字" /> 的 Debuff 提示：
        </div>
        <div class="slot-window active" id="window-p1">
          <div class="slot-reel" id="reel-p1">
            <div class="slot-item">等待抽取 debuff...</div>
          </div>
        </div>
      </div>

      <!-- 3. 选手B抽取栏 -->
      <div class="slot-row">
        <div class="row-title">
          👤 <input type="text" id="player2Name" class="inline-player-input" value="选手 B" placeholder="输入名字" /> 的 Debuff 提示：
        </div>
        <div class="slot-window active" id="window-p2">
          <div class="slot-reel" id="reel-p2">
            <div class="slot-item">等待抽取 debuff...</div>
          </div>
        </div>
      </div>
    </div>

    <div class="controls">
      <button class="btn-spin" id="spinBtn">摇一摇！</button>
      <button class="btn-reset" id="resetBtn">重置</button>
    </div>
  </div>

  <!-- FAQ 区域 -->
  <div class="faq-section">
    <h2 class="faq-title">💡 当前 Debuff 规则答疑 (FAQ)</h2>
    <div id="faq-content">
      <p style="color: var(--text-muted); font-style: italic;">暂无抽取的 Debuff 规则说明。</p>
    </div>
  </div>
</div>

<script>
  let mapsPool = [];
  let debuffsPool = [];
  let isSpinning = false;

  const ITEM_HEIGHT = 50; 

  // 获取 DOM 元素
  const spinBtn = document.getElementById('spinBtn');
  const resetBtn = document.getElementById('resetBtn');
  const reelMap = document.getElementById('reel-map');
  const reelP1 = document.getElementById('reel-p1');
  const reelP2 = document.getElementById('reel-p2');
  const faqContent = document.getElementById('faq-content');
  const player1Input = document.getElementById('player1Name');
  const player2Input = document.getElementById('player2Name');

  // 后备保障数据
  const fallbackMaps = [{ id: 1, name: " [后备] 月球巡礼" }];
  const fallbackDebuffs = [{ id: 1, name: " [后备] 禁止使用鼠标", weight: 1, FAQ: "无" }];

  // 初始化加载外部 JSON
  async function loadData() {
    try {
      const [mapsRes, debuffsRes] = await Promise.all([
        fetch('map.json').then(r => r.ok ? r.json() : fallbackMaps),
        fetch('debuff.json').then(r => r.ok ? r.json() : fallbackDebuffs)
      ]);
      mapsPool = mapsRes;
      debuffsPool = debuffsRes;
    } catch (err) {
      console.warn('读取配置文件失败，使用后备保障数据', err);
      mapsPool = fallbackMaps;
      debuffsPool = fallbackDebuffs;
    }
    resetDraw();
  }

  // 重置界面与状态
  function resetDraw() {
    if (isSpinning) return;
    
    // 重置地图滚轮
    reelMap.style.transition = 'none';
    reelMap.style.transform = 'translateY(0px)';
    reelMap.innerHTML = '<div class="slot-item">等待抽取比赛地图...</div>';

    // 重置选手1滚轮
    reelP1.style.transition = 'none';
    reelP1.style.transform = 'translateY(0px)';
    reelP1.innerHTML = '<div class="slot-item">等待抽取 debuff...</div>';

    // 重置选手2滚轮
    reelP2.style.transition = 'none';
    reelP2.style.transform = 'translateY(0px)';
    reelP2.innerHTML = '<div class="slot-item">等待抽取 debuff...</div>';

    // 重置FAQ
    faqContent.innerHTML = '<p style="color: var(--text-muted); font-style: italic;">暂无抽取的 Debuff 规则说明。</p>';
    spinBtn.disabled = false;
  }

  // 权重随机抽取算法
  function getRandomWeightedItem(pool) {
    const totalWeight = pool.reduce((sum, item) => sum + (Number(item.weight) || 1), 0);
    let random = Math.random() * totalWeight;
    for (const item of pool) {
      const w = Number(item.weight) || 1;
      if (random < w) return item;
      random -= w;
    }
    return pool[pool.length - 1];
  }

  // 单个滚轮的滚动动画处理函数
  function animateReel(reel, allNames, targetName, callback) {
    const spinSequence = [];
    const totalItemsInSpin = 30;

    for (let i = 0; i < totalItemsInSpin - 1; i++) {
      const randomName = allNames[Math.floor(Math.random() * allNames.length)];
      spinSequence.push(randomName);
    }
    spinSequence.push(targetName);

    reel.style.transition = 'none';
    reel.style.transform = 'translateY(0px)';
    reel.innerHTML = spinSequence.map(name => `<div class="slot-item">${name}</div>`).join('');

    reel.offsetHeight; 

    const targetY = -((spinSequence.length - 1) * ITEM_HEIGHT) + 20;

    reel.style.transition = 'transform 3.5s cubic-bezier(0.15, 0.85, 0.35, 1.0)';
    reel.style.transform = `translateY(${targetY}px)`;

    setTimeout(callback, 3600);
  }

  // 开始同时抽取
  function spinAll() {
    if (isSpinning) return;
    if (!mapsPool || mapsPool.length === 0 || !debuffsPool || debuffsPool.length === 0) {
      alert("抽签池数据为空，请确认外部 json 文件存在并格式正确。");
      return;
    }

    isSpinning = true;
    spinBtn.disabled = true;

    // =================【第一步：先抽选手 A 的 debuff】=================
    const wonDebuffP1 = getRandomWeightedItem(debuffsPool);

    // =================【第二步：再抽选手 B 的 debuff】=================
    const targetWeight = wonDebuffP1.weight;
    const banIdsByP1 = Array.isArray(wonDebuffP1.ban) ? wonDebuffP1.ban : []; 

    // 筛选：必须和 A 相同的 weight，且不能在 A 的 ban 数组里
    const p2EligiblePool = debuffsPool.filter(item => {
      const isSameWeight = item.weight === targetWeight;
      const isNotBanned = !banIdsByP1.map(String).includes(String(item.id));
      return isSameWeight && isNotBanned;
    });

    let wonDebuffP2;
    if (p2EligiblePool.length > 0) {
      wonDebuffP2 = getRandomWeightedItem(p2EligiblePool);
    } else {
      // 降级防错：如果全被 ban 掉了，则被迫和选手 A 拿一样的
      wonDebuffP2 = wonDebuffP1; 
    }

    // =================【第三步：最后抽比赛地图】=================
    // 获取两位选手 Debuff 要求的最低人数限制（若无该字段则默认为 0）
    const reqNumP1 = Number(wonDebuffP1.req_num) || 0;
    const reqNumP2 = Number(wonDebuffP2.req_num) || 0;
    // 地图人数 num 必须同时满足不小于两人的 req_num (即满足两人的最大值)
    const requiredMinPlayers = Math.max(reqNumP1, reqNumP2);

    // 过滤出符合人数限制的地图池
    const eligibleMapsPool = mapsPool.filter(map => {
      const mapNum = Number(map.num) || 0;
      return mapNum >= requiredMinPlayers;
    });

    let wonMap;
    if (eligibleMapsPool.length > 0) {
      wonMap = eligibleMapsPool[Math.floor(Math.random() * eligibleMapsPool.length)];
    } else {
      // 降级防错：如果没有任何一张地图满足人数，则从全部地图里盲抽
      console.warn(`未找到支持 ${requiredMinPlayers} 人的地图，已从全地图池中抽取。`);
      wonMap = mapsPool[Math.floor(Math.random() * mapsPool.length)];
    }

    // =================【第四步：执行跑马灯动画与渲染】=================
    let finishedCount = 0;
    const checkAllFinished = () => {
      finishedCount++;
      if (finishedCount === 3) {
        isSpinning = false;
        spinBtn.disabled = false;
        const p1Name = player1Input.value.trim() || '选手 A';
        const p2Name = player2Input.value.trim() || '选手 B';
        renderFAQ(p1Name, wonDebuffP1, p2Name, wonDebuffP2);
      }
    };

    // 跑马灯滚动效果，最终结果使用前面计算出来的 wonMap、wonDebuffP1、wonDebuffP2
    animateReel(reelMap, mapsPool.map(m => m.name), wonMap.name, checkAllFinished);
    animateReel(reelP1, debuffsPool.map(d => d.name), wonDebuffP1.name, checkAllFinished);
    animateReel(reelP2, debuffsPool.map(d => d.name), wonDebuffP2.name, checkAllFinished);
  }

  // 渲染右侧 FAQ 区域
  function renderFAQ(p1Name, p1Debuff, p2Name, p2Debuff) {
    let html = '';
    
    html += `
      <div class="faq-box" style="margin-bottom: 1rem;">
        <h3>${p1Name} Debuff 补充说明:</h3>
        <p><strong>${p1Debuff.name}</strong></p>
        <p style="margin-top:0.4rem;">${p1Debuff.FAQ || '暂无说明'}</p>
      </div>
    `;

    html += `
      <div class="faq-box">
        <h3>${p2Name} Debuff 补充说明:</h3>
        <p><strong>${p2Debuff.name}</strong></p>
        <p style="margin-top:0.4rem;">${p2Debuff.FAQ || '暂无说明'}</p>
      </div>
    `;

    faqContent.innerHTML = html;
  }

  spinBtn.addEventListener('click', spinAll);
  resetBtn.addEventListener('click', resetDraw);

  loadData();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>红警debuff抽取机</title>
  <style>
    :root {
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #f59e0b;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem;
    }

    .app-container {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 2rem;
      width: 100%;
      max-width: 1350px;
      background: var(--card-bg);
      padding: 2rem;
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    @media (max-width: 768px) {
      .app-container {
        grid-template-columns: 1fr;
      }
    }

    /* Main Slot Section */
    .slot-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }

    .title {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--text);
    }

    /* Slot Reel Box */
    .slot-window {
      position: relative;
      width: 100%;
      max-width: 850px;
      height: 120px;
      background: #090d16;
      border: 4px solid var(--primary);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.8);
    }

    /* Center indicator frame */
    .slot-window::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      border-top: 35px solid rgba(9, 13, 22, 0.6);
      border-bottom: 35px solid rgba(9, 13, 22, 0.6);
      z-index: 2;
      pointer-events: none;
    }

    .slot-window::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 50px;
      transform: translateY(-50%);
      border-top: 2px solid var(--accent);
      border-bottom: 2px solid var(--accent);
      z-index: 3;
      pointer-events: none;
    }

    .slot-reel {
      display: flex;
      flex-direction: column;
      position: absolute;
      width: 100%;
      top: 0;
      left: 0;
      will-change: transform;
    }

    .slot-item {
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.15rem;
      font-weight: 600;
      color: #fff;
      text-align: center;
      padding: 0 1rem;
      /* Fixed: adjusted from 54px to keep text vertically centered */
      padding-top: 4px;
    }

    /* Controls */
    .controls {
      display: flex;
      gap: 1rem;
      width: 100%;
      max-width: 850px;
    }

    button {
      flex: 1;
      padding: 0.85rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-spin {
      background-color: var(--primary);
      color: white;
    }

    .btn-spin:hover:not(:disabled) {
      background-color: var(--primary-hover);
      transform: translateY(-1px);
    }

    .btn-spin:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-reset {
      background-color: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      flex: 0.3;
    }

    .btn-reset:hover {
      background-color: rgba(255, 255, 255, 0.05);
      color: var(--text);
    }

    /* History Section */
    .history-section {
      border-left: 1px solid var(--border);
      padding-left: 1.5rem;
      display: flex;
      flex-direction: column;
    }

    @media (max-width: 768px) {
      .history-section {
        border-left: none;
        border-top: 1px solid var(--border);
        padding-left: 0;
        padding-top: 1.5rem;
      }
    }

    .history-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 1rem;
      color: var(--text-muted);
    }

    .history-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      overflow-y: auto;
      max-height: 350px;
    }

    .history-item {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      padding: 0.6rem 0.8rem;
      border-radius: 6px;
      font-size: 0.85rem;
      line-height: 1.4;
      display: flex;
      align-items: flex-start;
      animation: fadeIn 0.3s ease;
    }

    .history-item .order {
      color: var(--accent);
      font-weight: 700;
      margin-right: 0.5rem;
      flex-shrink: 0;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateX(10px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .empty-msg {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-style: italic;
    }
  </style>
</head>
<body>

<div class="app-container">
  <!-- Slot Reel Machine -->
  <div class="slot-section">
    <h1 class="title">🎮 红警 Debuff 抽取机</h1>
    
    <div class="slot-window">
      <div class="slot-reel" id="reel">
        <div class="slot-item">点击“旋转”开始抽debuff！</div>
      </div>
    </div>

    <div class="controls">
      <button class="btn-spin" id="spinBtn">旋转!</button>
      <button class="btn-reset" id="resetBtn">重置</button>
    </div>
  </div>

  <!-- History Panel -->
  <div class="history-section">
    <h2 class="history-title">已经获得过的 debuff：</h2>
    <ul class="history-list" id="historyList">
      <li class="empty-msg" id="emptyMsg">暂时还没有抽到任何 debuff。</li>
    </ul>
  </div>
</div>

<script>
  let initialPrizes = [];
  let availablePrizes = [];
  let drawnPrizes = [];
  let isSpinning = false;

  const reel = document.getElementById('reel');
  const spinBtn = document.getElementById('spinBtn');
  const resetBtn = document.getElementById('resetBtn');
  const historyList = document.getElementById('historyList');
  const emptyMsg = document.getElementById('emptyMsg');

  const ITEM_HEIGHT = 50; // height of each item in pixels

  // Embedded Red Alert debuffs fallback data
  const fallbackPrizes = [
    { id: "1", name: "禁止建造犀牛坦克或灰熊坦克", weight: 1, stock: 1 },
    { id: "2", name: "禁止建造防空履带车或多功能步兵车", weight: 1, stock: 1 },
    { id: "3", name: "禁止建造军犬、恐怖机器人、火箭飞行兵或间谍卫星", weight: 1, stock: 1 },
    { id: "4", name: "禁止建造防御栏的建筑，超级武器除外", weight: 11, stock: 1 },
    { id: "5", name: "禁止建造雷达或空指部", weight: 1, stock: 1 },
    { id: "6", name: "必须使用利比亚，且对手的建造栏建筑只能用自爆卡车或核弹摧毁", weight: 1, stock: 1 },
    { id: "7", name: "第一个矿场附赠的采矿车只能在对手基地旁的矿区采矿", weight: 1, stock: 1 },
    { id: "8", name: "禁止建造动员兵、美国大兵和军犬，卖建筑赠送的步兵单位要在10秒内自行消灭", weight: 1, stock: 1 },
    { id: "9", name: "禁止使用键盘操作", weight: 1, stock: 1 },
    { id: "10", name: "每当摧毁一个敌方建筑栏建筑，需要挂机3秒钟嘲讽对手", weight: 1, stock: 1 }
  ];

  // Fetch debuff.json or use fallback
  async function loadPrizes() {
    try {
      const response = await fetch('debuff.json');
      if (!response.ok) throw new Error('Network response was not ok');
      initialPrizes = await response.json();
    } catch (err) {
      console.warn('Could not load debuff.json. Using fallback embedded debuffs.', err);
      initialPrizes = JSON.parse(JSON.stringify(fallbackPrizes));
    }
    resetDraw();
  }

  // Reset the game state
  function resetDraw() {
    if (isSpinning) return;
    availablePrizes = JSON.parse(JSON.stringify(initialPrizes));
    drawnPrizes = [];
    historyList.innerHTML = '';
    historyList.appendChild(emptyMsg);
    emptyMsg.style.display = 'block';
    
    reel.style.transition = 'none';
    reel.style.transform = 'translateY(0px)';
    reel.innerHTML = '<div class="slot-item">点击“旋转”开始抽debuff！</div>';
    spinBtn.disabled = false;
  }

  // Weighted Random Draw algorithm (without replacement)
  function selectWeightedPrize() {
    const activePool = availablePrizes.filter(p => p.stock > 0);
    if (activePool.length === 0) return null;

    const totalWeight = activePool.reduce((sum, item) => sum + item.weight, 0);
    let random = Math.random() * totalWeight;

    for (const item of activePool) {
      if (random < item.weight) {
        // Mutate original reference stock
        const realItem = availablePrizes.find(p => p.id === item.id);
        realItem.stock -= 1; 
        return realItem;
      }
      random -= item.weight;
    }

    const lastItem = activePool[activePool.length - 1];
    const realItem = availablePrizes.find(p => p.id === lastItem.id);
    realItem.stock -= 1;
    return realItem;
  }

  // Spin Reel Animation
  function spin() {
    if (isSpinning) return;

    const wonPrize = selectWeightedPrize();
    if (!wonPrize) {
      alert('所有的 debuff 已经全部抽完！');
      spinBtn.disabled = true;
      return;
    }

    isSpinning = true;
    spinBtn.disabled = true;

    // Use all initial option names for ticker visuals
    const allNames = initialPrizes.map(p => p.name);
    const spinSequence = [];
    const totalItemsInSpin = 30;

    for (let i = 0; i < totalItemsInSpin - 1; i++) {
      const randomName = allNames[Math.floor(Math.random() * allNames.length)];
      spinSequence.push(randomName);
    }
    // Final element MUST be the won item
    spinSequence.push(wonPrize.name);

    // Render reel items
    reel.style.transition = 'none';
    reel.style.transform = 'translateY(0px)';
    reel.innerHTML = spinSequence
      .map(name => `<div class="slot-item">${name}</div>`)
      .join('');

    reel.offsetHeight; // Force layout recalculation

    // Stop position offset (+35 centers inside 120px window)
    const targetY = -((spinSequence.length - 1) * ITEM_HEIGHT) + 35;

    // Execute spin easing
    reel.style.transition = 'transform 3.5s cubic-bezier(0.15, 0.85, 0.35, 1.0)';
    reel.style.transform = `translateY(${targetY}px)`;

    // Complete spin callback
    setTimeout(() => {
      isSpinning = false;
      const remainingStock = availablePrizes.reduce((sum, p) => sum + p.stock, 0);
      spinBtn.disabled = remainingStock <= 0;
      recordPrize(wonPrize.name);
    }, 3600);
  }

  // Record drawn result to sidebar
  function recordPrize(prizeName) {
    drawnPrizes.push(prizeName);
    emptyMsg.style.display = 'none';

    const li = document.createElement('li');
    li.className = 'history-item';
    li.innerHTML = `<span class="order">#${drawnPrizes.length}</span><span>${prizeName}</span>`;
    
    historyList.prepend(li);
  }

  spinBtn.addEventListener('click', spin);
  resetBtn.addEventListener('click', resetDraw);

  loadPrizes();
</script>
</body>
</html>
